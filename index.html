<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ph-store | ملابس رجالي</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f1f3f0;--card:#fff;--ink:#14201c;--mute:#5d6b65;--line:#d9dfdb;--g:#1a9a68;--gd:#0f6b48;--red:#d6402b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1713;--card:#18231e;--ink:#eef3f0;--mute:#9aaba3;--line:#2a3a33}}
:root[data-theme="dark"]{--bg:#0f1713;--card:#18231e;--ink:#eef3f0;--mute:#9aaba3;--line:#2a3a33}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Cairo,Tahoma,sans-serif;line-height:1.6}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--g);outline-offset:2px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;padding:10px 14px}
.logo{font-weight:800;font-size:1.5rem;letter-spacing:-.5px;margin-inline-end:auto}
.logo b{color:var(--g)}
.hb{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:7px 12px;font-weight:600;position:relative}
.cnt{position:absolute;top:-7px;inset-inline-start:-7px;background:var(--red);color:#fff;border-radius:99px;font-size:.72rem;min-width:20px;height:20px;line-height:20px;text-align:center}
.hero{padding:34px 16px 20px;max-width:1100px;margin:auto}
.hero h1{font-size:clamp(2rem,7vw,3.6rem);line-height:1.15;margin:0 0 8px;font-weight:800}
.hero p{color:var(--mute);margin:0;max-width:44ch}
.bar{max-width:1100px;margin:0 auto;padding:6px 16px 14px;display:flex;gap:8px;flex-wrap:wrap}
.bar input{flex:1;min-width:180px;padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 14px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid{max-width:1100px;margin:auto;padding:0 16px 40px;display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.pc{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;text-align:start;padding:0;display:block;width:100%}
.pc img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block;background:#e8ece9}
.pc .in{padding:10px 12px 14px}
.pc h3{font-size:.98rem;margin:0 0 4px;font-weight:600}
.pr{font-weight:800;font-size:1.15rem}
.old{color:var(--mute);text-decoration:line-through;margin-inline-start:8px;font-size:.9rem;font-weight:400}
.off{position:absolute;top:10px;inset-inline-start:10px;background:var(--red);color:#fff;border-radius:8px;padding:2px 10px;font-weight:800;font-size:.85rem}
.pw{position:relative}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;display:none;align-items:center;justify-content:center;padding:12px}
.ov.on{display:flex}
.md{background:var(--card);border-radius:16px;max-width:760px;width:100%;max-height:92%;overflow:auto;padding:18px;position:relative}
.x{position:absolute;top:10px;inset-inline-end:12px;border:0;background:none;font-size:1.6rem}
.pd{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:600px){.pd{grid-template-columns:1fr}}
.pd img{width:100%;border-radius:12px}
.lb{font-weight:600;margin:12px 0 6px}
.opt{display:inline-block;border:1.5px solid var(--line);background:var(--bg);border-radius:10px;padding:5px 14px;margin:0 0 6px 6px}
.opt.on{border-color:var(--g);background:var(--g);color:#fff}
.btn{background:var(--g);color:#fff;border:0;border-radius:12px;padding:12px 18px;font-weight:800;width:100%;margin-top:12px}
.btn:hover{background:var(--gd)}
.btn.s{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.fld{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);margin:5px 0}
.tabs{display:flex;gap:6px;margin:10px 0}
.tabs .chip{flex:1}
.er{color:var(--red);font-size:.9rem;min-height:1.3em}
.dr{position:fixed;top:0;bottom:0;inset-inline-start:0;width:min(400px,100%);background:var(--card);z-index:30;transform:translateX(-102%);transition:transform .25s;padding:16px;overflow:auto;display:flex;flex-direction:column}
.dr.on{transform:none}
.li{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.li img{width:60px;height:80px;object-fit:cover;border-radius:8px}
.li div{flex:1}
.q button{width:28px;height:28px;border-radius:8px;border:1px solid var(--line);background:var(--bg)}
.ord{border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0}
.tag{display:inline-block;padding:1px 10px;border-radius:99px;font-size:.8rem;background:var(--g);color:#fff}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;z-index:50;display:none}
.note{font-size:.82rem;color:var(--mute);margin-top:10px}
footer{text-align:center;color:var(--mute);padding:20px;font-size:.85rem}
</style>
</head>
<body>
<header>
  <div class="logo">ph<b>-</b>store</div>
  <button class="hb" id="acc">حسابي</button>
  <button class="hb" id="cartb">السلة <span class="cnt" id="cnt">0</span></button>
</header>

<section class="hero">
  <h1>تيشيرتات رجالي<br>بخصم يوصل ٦٠٪</h1>
  <p>قطن مريح، مقاسات كبيرة متوفرة، والدفع عند الاستلام.</p>
</section>
<div class="bar">
  <input id="q" placeholder="ابحث عن منتج..." aria-label="بحث">
  <button class="chip on" data-f="all">الكل</button>
  <button class="chip" data-f="tee">تيشيرتات</button>
</div>
<main class="grid" id="grid"></main>
<footer>© ph-store</footer>

<div class="ov" id="ovP"><div class="md" id="mdP"></div></div>
<div class="ov" id="ovA"><div class="md" id="mdA" style="max-width:420px"></div></div>
<div class="ov" id="ovO"><div class="md" id="mdO"></div></div>
<aside class="dr" id="dr" aria-label="السلة"></aside>
<div class="toast" id="toast"></div>

function im(id){var p=P.find(function(x){return x.id===id});return (p&&p.img)||IMG[id]||""}
async function loadP(){try{var sn=await getDocs(collection(D,"products")),a=[];sn.forEach(function(d){var x=d.data();a.push({id:d.id,fb:1,t:x.t,p:x.p,o:x.o,c:(x.c||[]).map(function(n){return [n,""]}),s:x.s||[],img:x.img,ts:x.ts||0})});a.sort(function(x,y){return x.ts-y.ts});P=a.length?a:P0}catch(e){P=P0}grid()}
function comp(f){return new Promise(function(res,rej){var r=new FileReader();r.onload=function(){var i=new Image();i.onload=function(){var k=Math.min(1,700/i.width),c=document.createElement("canvas");c.width=i.width*k;c.height=i.height*k;c.getContext("2d").drawImage(i,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",.75))};i.onerror=rej;i.src=r.result};r.onerror=rej;r.readAsDataURL(f)})}
function sep(v){return v.split(/[,،]/).map(function(x){return x.trim()}).filter(Boolean)}
function prodMgr(){
  $("mdO").innerHTML='<button class="x" id="ox" aria-label="إغلاق">×</button><h2 style="margin-top:0">إدارة المنتجات</h2>'
  +P.map(function(p){return '<div class="li"><img src="'+im(p.id)+'" alt=""><div><b>'+esc(p.t)+'</b><br>'+p.p+' ج.م</div>'+(p.fb?'<button class="chip" data-d="'+p.id+'">حذف</button>':'')+'</div>'}).join("")
  +(P.some(function(p){return !p.fb})?'<button class="btn s" id="sd">نقل المنتجات الحالية لقاعدة البيانات</button>':'')
  +'<h3>إضافة منتج جديد</h3><input class="fld" id="pt" placeholder="اسم المنتج"><input class="fld" id="pp" type="number" inputmode="numeric" placeholder="السعر بعد الخصم"><input class="fld" id="po" type="number" inputmode="numeric" placeholder="السعر قبل الخصم"><input class="fld" id="pc" placeholder="الألوان مفصولة بفاصلة: أبيض، أسود"><input class="fld" id="ps" placeholder="المقاسات مفصولة بفاصلة: L, XL, 2XL"><input class="fld" id="pf" type="file" accept="image/*"><div class="er" id="pe"></div><button class="btn" id="pa">إضافة المنتج</button>';
  $("ox").onclick=function(){close("ovO")};
  document.querySelectorAll("[data-d]").forEach(function(b){b.onclick=async function(){if(!confirm("تحذف المنتج ده؟"))return;try{await deleteDoc(doc(D,"products",b.dataset.d));await loadP();prodMgr()}catch(x){toast("فشل الحذف")}}});
  if($("sd"))$("sd").onclick=async function(){try{for(var i=0;i<P0.length;i++){var q=P0[i];await addDoc(collection(D,"products"),{t:q.t,p:q.p,o:q.o,c:q.c.map(function(c){return c[0]}),s:q.s,img:IMG[q.id],ts:Date.now()+i})}await loadP();prodMgr();toast("تم النقل")}catch(x){toast("فشل النقل")}};
  $("pa").onclick=async function(){
    var t=$("pt").value.trim(),pr=+$("pp").value,o=+$("po").value||pr,c=sep($("pc").value),z=sep($("ps").value),f=$("pf").files[0],e=$("pe");
    if(!t||!pr||!c.length||!z.length||!f){e.textContent="كمّل الاسم والسعر والألوان والمقاسات واختار صورة.";return}
    $("pa").disabled=true;
    try{var img=await comp(f);await addDoc(collection(D,"products"),{t:t,p:pr,o:o,c:c,s:z,img:img,ts:Date.now()});await loadP();prodMgr();toast("اتضاف المنتج")}
    catch(x){e.textContent="فشل الإضافة. جرب صورة تانية.";$("pa").disabled=false}
  };
  open("ovO");
}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function toast(m){var t=$("toast");t.textContent=m;t.style.display="block";setTimeout(function(){t.style.display="none"},2200)}
async function hs(s){var b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("ph|"+s));return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,"0")}).join("")}
function open(o){$(o).classList.add("on")}
function close(o){$(o).classList.remove("on")}
["ovP","ovA","ovO"].forEach(function(i){$(i).addEventListener("click",function(e){if(e.target.id===i)close(i)})});

function grid(){
  var q=$("q").value.trim().toLowerCase();
  $("grid").innerHTML=P.filter(function(p){return p.t.toLowerCase().indexOf(q)>-1}).map(function(p){
    var off=Math.round((1-p.p/p.o)*100);
    return '<button class="pc" data-id="'+p.id+'"><div class="pw"><img src="'+im(p.id)+'" alt="'+p.t+'">'+(off>0?'<span class="off">-'+off+'%</span>':'')+'</div><div class="in"><h3>'+p.t+'</h3><span class="pr">'+p.p+' ج.م</span><span class="old">'+p.o+'</span></div></button>'}).join("")||'<p>مفيش منتجات بالاسم ده.</p>';
}

function prod(id){
  var p=P.find(function(x){return x.id===id});sel={id:id,c:p.c[0][0],s:p.s[0],n:1};
  function draw(){
    $("mdP").innerHTML='<button class="x" aria-label="إغلاق" id="px">×</button><div class="pd"><img src="'+im(id)+'" alt=""><div><h2 style="margin:0 0 6px">'+p.t+'</h2><span class="pr" style="font-size:1.5rem">'+p.p+' ج.م</span><span class="old">'+p.o+' ج.م</span>'
    +'<div class="lb">اللون</div>'+p.c.map(function(c){return '<button class="opt co'+(c[0]===sel.c?' on':'')+'" data-v="'+c[0]+'">'+c[0]+'</button>'}).join("")
    +'<div class="lb">المقاس</div>'+p.s.map(function(s){return '<button class="opt so'+(s===sel.s?' on':'')+'" data-v="'+s+'">'+s+'</button>'}).join("")
    +'<div class="lb">الكمية</div><div class="q"><button id="mn">−</button> <b style="margin:0 10px">'+sel.n+'</b> <button id="pl">+</button></div>'
    +'<button class="btn" id="add">أضف للسلة</button></div></div>';
    $("px").onclick=function(){close("ovP")};
    document.querySelectorAll(".co").forEach(function(b){b.onclick=function(){sel.c=b.dataset.v;draw()}});
    document.querySelectorAll(".so").forEach(function(b){b.onclick=function(){sel.s=b.dataset.v;draw()}});
    $("mn").onclick=function(){if(sel.n>1){sel.n--;draw()}};
    $("pl").onclick=function(){sel.n++;draw()};
    $("add").onclick=function(){
      var k=cart.find(function(i){return i.id===sel.id&&i.c===sel.c&&i.s===sel.s});
      if(k)k.n+=sel.n;else cart.push({id:sel.id,c:sel.c,s:sel.s,n:sel.n});
      close("ovP");cartUI();toast("اتضاف للسلة");
    };
  }
  draw();open("ovP");
}

function total(){return cart.reduce(function(a,i){return a+P.find(function(p){return p.id===i.id}).p*i.n},0)}
function cartUI(){
  $("cnt").textContent=cart.reduce(function(a,i){return a+i.n},0);
  var d=$("dr");
  d.innerHTML='<div style="display:flex;justify-content:space-between;align-items:center"><h2 style="margin:0">السلة</h2><button class="x" style="position:static" id="dx" aria-label="إغلاق">×</button></div>'
  +(cart.length?cart.map(function(i,x){var p=P.find(function(q){return q.id===i.id});
    return '<div class="li"><img src="'+im(i.id)+'" alt=""><div><b>'+p.t+'</b><br><small>'+i.c+' • '+i.s+'</small><br><span class="q"><button data-m="'+x+'">−</button> '+i.n+' <button data-p="'+x+'">+</button></span></div><b>'+p.p*i.n+'</b></div>'}).join("")
    +'<p style="font-size:1.2rem"><b>الإجمالي: '+total()+' ج.م</b></p><button class="btn" id="co">إتمام الطلب</button>'
    :'<p style="color:var(--mute)">السلة فاضية. اختار منتج وضيفه.</p>');
  $("dx").onclick=function(){d.classList.remove("on")};
  d.querySelectorAll("[data-m]").forEach(function(b){b.onclick=function(){var i=cart[+b.dataset.m];i.n--;if(i.n<1)cart.splice(+b.dataset.m,1);cartUI()}});
  d.querySelectorAll("[data-p]").forEach(function(b){b.onclick=function(){cart[+b.dataset.p].n++;cartUI()}});
  if($("co"))$("co").onclick=function(){if(!me){d.classList.remove("on");auth("لازم تسجل دخول الأول عشان تكمل الطلب.");return}checkout()};
}

  var loc=null;
  $("mdO").innerHTML='<button class="x" id="ox" aria-label="إغلاق">×</button><h2 style="margin-top:0">بيانات التوصيل</h2><input class="fld" id="on" placeholder="الاسم بالكامل"><input class="fld" id="op" placeholder="رقم التليفون" inputmode="tel" value="'+esc(me.phone||"")+'">'
  +'<select class="fld" id="oc"><option value="">اختار المحافظة / المنطقة</option>'+Object.keys(SHIP).map(function(k){return '<option>'+k+'</option>'}).join("")+'</select><input class="fld" id="og" placeholder="اسم المحافظة" style="display:none">'
  +'<input class="fld" id="od" placeholder="المنطقة / الحي (مثال: المهندسين، مدينة نصر)"><input class="fld" id="oa" placeholder="الشارع ورقم العمارة والدور والشقة">'
  +'<button class="btn s" id="gl" style="margin-top:6px">📍 حدد موقعي الحالي</button><div class="note" id="gs">اختياري: بيساعد المندوب يوصلك أسرع.</div>'
  +'<div style="margin:12px 0;line-height:2">المنتجات: <b>'+total()+'</b> ج.م<br>الشحن: <b id="sh">اختار المحافظة</b><br><span style="font-size:1.15rem">الإجمالي: <b id="tt">'+total()+'</b> ج.م</span></div>'
  +'<p class="note" style="margin:0">الدفع عند الاستلام. التوصيل لكل المحافظات.</p><div class="er" id="oe"></div><button class="btn" id="os">تأكيد الطلب</button>';
  $("ox").onclick=function(){close("ovO")};
  function ship(){$("og").style.display=$("oc").value==="محافظة أخرى"?"block":"none";var v=SHIP[$("oc").value];$("sh").textContent=v?v+" ج.م":"اختار المحافظة";$("tt").textContent=total()+(v||0)}
  $("oc").onchange=ship;
  $("gl").onclick=function(){
    var g=$("gs");
    if(!navigator.geolocation){g.textContent="المتصفح مش بيدعم تحديد الموقع، اكتب العنوان بالتفصيل.";return}
    g.textContent="بنحدد موقعك...";
    navigator.geolocation.getCurrentPosition(function(r){loc={lat:+r.coords.latitude.toFixed(6),lng:+r.coords.longitude.toFixed(6)};g.textContent="✔ تم تحديد موقعك"},
      function(){g.textContent="مقدرناش نحدد موقعك. اسمح بالوصول للموقع أو اكتب العنوان بالتفصيل."},{enableHighAccuracy:true,timeout:10000});
  };
  $("os").onclick=async function(){
    var n=$("on").value.trim(),p=$("op").value.trim(),c0=$("oc").value,c=c0==="محافظة أخرى"?$("og").value.trim():c0,d=$("od").value.trim(),a=$("oa").value.trim();
    if(!n||!p||!c||!d||!a){$("oe").textContent="كمّل كل البيانات واختار المحافظة.";return}
    var sp=SHIP[c0];
    var o={code:"PH"+Date.now().toString().slice(-6),uid:me.uid,u:me.id,n:n,p:p,c:c,a:d+" - "+a,loc:loc,sp:sp,items:cart.map(function(i){var q=P.find(function(x){return x.id===i.id});return {t:q.t,c:i.c,s:i.s,n:i.n,pr:q.p}}),sub:total(),tot:total()+sp,d:new Date().toLocaleString("ar-EG"),ts:Date.now(),st:"جديد"};
    $("os").disabled=true;
    try{await addDoc(collection(D,"orders"),o)}catch(x){$("oe").textContent="حصلت مشكلة في إرسال الطلب، حاول تاني.";$("os").disabled=false;return}
    cart=[];cartUI();
    $("mdO").innerHTML='<h2>تم استلام طلبك ✔</h2><p>رقم الطلب: <b>'+o.code+'</b><br>الإجمالي شامل الشحن: <b>'+o.tot+' ج.م</b><br>هنكلمك على '+esc(p)+' لتأكيد الطلب.</p><button class="btn" id="ok">تمام</button>';
    $("ok").onclick=function(){close("ovO")};
  };
  open("ovO");
}

var FE=function(p){return p.replace(/\D/g,"")+"@phone.ph-store.app"};
var EM={"auth/email-already-in-use":"الحساب ده موجود، سجّل دخول.","auth/invalid-credential":"البيانات غلط.","auth/wrong-password":"البيانات غلط.","auth/user-not-found":"البيانات غلط.","auth/weak-password":"كلمة السر ضعيفة.","auth/too-many-requests":"محاولات كتير، استنى شوية."};
function auth(msg){
  var mode="phone",reg=false;
  function draw(){
    $("mdA").innerHTML='<button class="x" id="ax" aria-label="إغلاق">×</button><h2 style="margin:0">'+(reg?"إنشاء حساب":"تسجيل الدخول")+'</h2>'
    +(msg?'<p style="color:var(--mute);margin:4px 0">'+msg+'</p>':'')
    +'<button class="btn s" id="gg">الدخول بحساب جوجل</button><p class="note" style="text-align:center;margin:8px 0 0">أو</p>'
    +'<div class="tabs"><button class="chip'+(mode==="phone"?' on':'')+'" id="t1">رقم التليفون</button><button class="chip'+(mode==="mail"?' on':'')+'" id="t2">الإيميل</button></div>'
    +(mode==="phone"?'<input class="fld" id="id" placeholder="رقم التليفون" inputmode="tel" autocomplete="tel">':'<input class="fld" id="id" placeholder="example@gmail.com" type="email" autocomplete="email">')
    +'<input class="fld" id="pw" type="password" placeholder="كلمة السر (6 أحرف على الأقل)" autocomplete="'+(reg?"new-password":"current-password")+'"><div class="er" id="ae"></div>'
    +'<button class="btn" id="go">'+(reg?"إنشاء الحساب":"دخول")+'</button><button class="btn s" id="sw">'+(reg?"عندي حساب بالفعل":"مستخدم جديد؟ سجّل")+'</button>';
    $("ax").onclick=function(){close("ovA")};
    $("t1").onclick=function(){mode="phone";draw()};$("t2").onclick=function(){mode="mail";draw()};
    $("sw").onclick=function(){reg=!reg;draw()};
    $("gg").onclick=async function(){try{await signInWithPopup(A,new GoogleAuthProvider());close("ovA")}catch(x){$("ae").textContent="مكملش الدخول بجوجل، حاول تاني."}};
    $("go").onclick=async function(){
      var id=$("id").value.trim().toLowerCase(),pw=$("pw").value,e=$("ae");
      if(mode==="phone"&&!/^\+?\d{10,14}$/.test(id)){e.textContent="رقم التليفون غير صحيح.";return}
      if(mode==="mail"&&!/^\S+@\S+\.\S+$/.test(id)){e.textContent="الإيميل غير صحيح.";return}
      if(pw.length<6){e.textContent="كلمة السر لازم تكون 6 أحرف على الأقل.";return}
      var em=mode==="phone"?FE(id):id;
      if(reg&&em===ADMIN){e.textContent="الإيميل ده للإدارة، ادخل بجوجل.";return}
      try{if(reg)await createUserWithEmailAndPassword(A,em,pw);else await signInWithEmailAndPassword(A,em,pw);close("ovA");toast("أهلاً بيك")}
      catch(x){e.textContent=EM[x.code]||"حصلت مشكلة، حاول تاني."}
    };
  }
  draw();open("ovA");
}
onAuthStateChanged(A,function(u){
  if(u){var em=u.email||"",ph=em.indexOf("@phone.ph-store.app")>0;
    me={uid:u.uid,id:ph?em.split("@")[0]:em,phone:ph?em.split("@")[0]:"",admin:em===ADMIN&&u.emailVerified};
    setDoc(doc(D,"users",u.uid),{login:me.id,phone:me.phone,last:serverTimestamp()},{merge:true}).catch(function(){});
  }else me=null;
  acc();
});
function acc(){$("acc").textContent=me?(me.admin?"لوحة الإدارة":"طلباتي"):"حسابي"}
$("acc").onclick=async function(){
  if(!me){auth();return}
  var list=[];
  try{var sn=await getDocs(me.admin?query(collection(D,"orders")):query(collection(D,"orders"),where("uid","==",me.uid)));sn.forEach(function(d){var o=d.data();o.fid=d.id;list.push(o)});list.sort(function(a,b){return (b.ts||0)-(a.ts||0)})}catch(x){toast("تعذر تحميل الطلبات")}
  $("mdO").innerHTML='<button class="x" id="ox" aria-label="إغلاق">×</button><h2 style="margin-top:0">'+(me.admin?"طلبات العملاء ("+list.length+")":"طلباتي")+'</h2>'
  +(list.length?list.map(function(o,x){return '<div class="ord"><b>'+esc(o.code)+'</b> <span class="tag">'+esc(o.st)+'</span> <small>'+esc(o.d)+'</small>'
    +(me.admin?'<br>'+esc(o.n)+' — '+esc(o.p)+'<br>'+esc(o.c)+' — '+esc(o.a)+(o.loc?'<br><a href="https://www.google.com/maps?q='+o.loc.lat+','+o.loc.lng+'" target="_blank" rel="noopener">📍 افتح الموقع على الخريطة</a>':''):'')
    +'<ul style="margin:6px 0;padding-inline-start:18px">'+o.items.map(function(i){return '<li>'+esc(i.t)+' ('+esc(i.c)+' / '+esc(i.s)+') × '+i.n+'</li>'}).join("")+'</ul>شحن: '+(o.sp||0)+' ج.م — <b>الإجمالي '+o.tot+' ج.م</b>'
    +(me.admin?' <select data-o="'+x+'" class="fld" style="width:auto">'+["جديد","تم التأكيد","في الطريق","تم التسليم","ملغي"].map(function(s){return '<option'+(s===o.st?' selected':'')+'>'+s+'</option>'}).join("")+'</select>':'')+'</div>'}).join(""):'<p style="color:var(--mute)">مفيش طلبات لسه.</p>')
  +(me.admin?'<button class="btn" id="pm">إدارة المنتجات (إضافة / حذف)</button>':'')+'<button class="btn s" id="lo">تسجيل خروج</button>';
  $("ox").onclick=function(){close("ovO")};
  if($("pm"))$("pm").onclick=prodMgr;
  $("lo").onclick=async function(){await signOut(A);close("ovO");toast("تم تسجيل الخروج")};
  document.querySelectorAll("[data-o]").forEach(function(s){s.onchange=function(){updateDoc(doc(D,"orders",list[+s.dataset.o].fid),{st:s.value}).then(function(){toast("اتحدثت حالة الطلب")}).catch(function(){toast("فشل التحديث")})}});
  open("ovO");
};
document.querySelectorAll(".chip[data-f]").forEach(function(b){b.onclick=function(){document.querySelectorAll(".chip[data-f]").forEach(function(x){x.classList.remove("on")});b.classList.add("on");grid()}});
grid();cartUI();loadP();
</script>
</body>
</html>
