<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>اطفيح مول</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js" crossorigin="anonymous"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js" crossorigin="anonymous"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js" crossorigin="anonymous"></script>
<style>
:root{--pr:#f97316;--pr2:#ea580c;--soft:#ffedd5;--bg:#fff7ed;--card:#fff;--tx:#1f2937;--border:#fde2c8;--text-secondary:#7c6f64;--text-accent:#c2410c;--text-danger:#dc2626;--border-accent:#f97316;--border-danger:#dc2626;--bg-accent:#ffedd5;--bg-success:#dcfce7;--surface-1:#ffedd5;--grn:#16a34a}
@media(prefers-color-scheme:dark){:root{--bg:#17120e;--card:#241c15;--tx:#f5ede4;--border:#3b2d20;--text-secondary:#b9a999;--text-accent:#fdba74;--soft:#3b2615;--bg-accent:#3b2615;--bg-success:#14351f;--surface-1:#3b2615;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,Tahoma,sans-serif;font-size:16px}
#r{max-width:640px;margin:auto;padding:0 12px 24px}
.hdr{display:flex;justify-content:space-between;align-items:center;gap:8px;background:linear-gradient(135deg,#f97316,#ea580c);color:#fff;margin:0 -12px 12px;padding:14px 14px;border-radius:0 0 22px 22px;box-shadow:0 6px 18px rgba(234,88,12,.25)}
.hdr b{font-size:22px}.hdr button{background:rgba(255,255,255,.22);color:#fff;padding:8px 12px;font-size:14px}
.who{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--soft);border-radius:14px;padding:8px 12px;margin-bottom:10px;font-size:13px;color:var(--text-accent);font-weight:600}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:12px;margin:10px 0;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.shop{display:flex;align-items:center;gap:12px;cursor:pointer}.shop .ic{width:48px;height:48px;border-radius:14px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:26px;flex:none}
.tag{display:inline-block;font-size:12px;padding:2px 10px;border-radius:99px;background:var(--soft);color:var(--text-accent);font-weight:600;margin-top:2px}
.price{background:var(--bg-success);color:var(--grn);font-weight:700;border-radius:10px;padding:2px 10px;white-space:nowrap;height:fit-content}
.sec{font-weight:800;font-size:17px;margin:16px 0 4px}
button{font:inherit;font-weight:600;cursor:pointer;border:0;border-radius:12px;padding:9px 16px;background:linear-gradient(135deg,#f97316,#ea580c);color:#fff;box-shadow:0 3px 8px rgba(234,88,12,.25)}
button:active{transform:scale(.97)}
button[data-a=home]{background:var(--soft);color:var(--text-accent);box-shadow:none}
.who button{background:var(--card);color:var(--text-accent);box-shadow:none;padding:6px 12px}
button[data-m],button[data-p]{width:34px;height:34px;padding:0;border-radius:50%;font-size:18px;background:var(--soft);color:var(--text-accent);box-shadow:none}
button[data-ask]{background:#fee2e2;color:#dc2626;box-shadow:none}
button[data-cd]{background:#dc2626;color:#fff}
button[data-o]{background:linear-gradient(135deg,#22c55e,#16a34a);box-shadow:0 3px 8px rgba(22,163,74,.3)}
button[data-a=pick]{background:var(--soft);color:var(--text-accent);box-shadow:none;border:2px dashed var(--pr)}
.chip{flex:1;background:var(--card);color:var(--tx);border:2px solid var(--border);box-shadow:none}
.chip.on{background:var(--pr);color:#fff;border-color:var(--pr)}
input,select{font:inherit;color:var(--tx);background:var(--card);border:2px solid var(--border);border-radius:12px;padding:11px 14px;width:100%;margin:5px 0;outline:0}
input:focus,select:focus{border-color:var(--pr)}select option{color:#000}
a.wa{display:block;text-align:center;background:linear-gradient(135deg,#22c55e,#16a34a);color:#fff;padding:12px;border-radius:12px;text-decoration:none;font-weight:700}
h2{margin:12px 0 4px}button[data-a=addP],button[data-a=addS],button[data-a=lg]{width:100%;margin-top:8px;padding:12px}
</style></head><body>
<div dir="rtl" id="r"></div>
<script>
window.onerror=function(m,u,l){window.FBERR=window.FBERR||(m+" @"+l);try{draw()}catch(_){}};
/* ====== إعدادات Firebase ====== */
const firebaseConfig={
 apiKey:"AIzaSyA3vIpvneFnlXyqXsKiDtFft-66oW0zAek",
 authDomain:"atfeeh-mol.firebaseapp.com",
 projectId:"atfeeh-mol",
 storageBucket:"atfeeh-mol.firebasestorage.app",
 messagingSenderId:"439076904666",
 appId:"1:439076904666:web:d58fc26b7e3f35c9fa0fe3"
};
/* ================================================================ */
const ADMIN="ana.filo2007@gmail.com",DOM="@atfeeh-mall.app";
let sec,auth,db;
try{firebase.initializeApp(firebaseConfig);sec=firebase.initializeApp(firebaseConfig,'sec');auth=firebase.auth();db=firebase.firestore()}catch(e){window.FBERR='Firebase: '+e.message}
const S={shops:[],prods:[],cart:{},v:'home',cur:null,f:'all',q:'',adm:false,sub:null,id:1,done:null,img:null,del:null,cust:{n:'',p:'',a:''},user:null};
const R=document.getElementById('r');
const E=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const T=t=>t=='rest'?'مطعم':'سوبر ماركت';
const B='';
async function H(s){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){return s}}
const cnt=()=>Object.values(S.cart).reduce((a,c)=>a+c.n,0);
const IM=(u,w)=>u?`<img src="${u}" style="width:${w}px;height:${w}px;object-fit:cover;border-radius:8px;flex:none">`:`<div style="width:${w}px;height:${w}px;border-radius:8px;background:var(--surface-1);flex:none"></div>`;
function topbar(){const who=S.sub?`صاحب المتجر: ${E(S.sub.name)}`:S.adm?'الأدمن الرئيسي':'';
 return `<div class="hdr"><b>🛍️ اطفيح مول</b><span><button data-a="adm">الإدارة</button> <button data-a="cart">السلة (${cnt()})</button></span></div>`+(who?`<div class="who"><span>👤 ${who}</span><button data-a="logout">تسجيل خروج</button></div>`:'')}
function pc(p){const s=S.shops.find(x=>x.id==p.sid);return `<div class="card" style="display:flex;gap:10px">${IM(p.img,76)}<div style="flex:1;min-width:0"><div style="display:flex;justify-content:space-between;gap:6px"><b>${E(p.name)}</b><span class="price">${E(p.price)} ج</span></div>${p.specs?`<div style="font-size:13px;color:var(--text-secondary)">${E(p.specs)}</div>`:''}<div style="display:flex;justify-content:space-between;align-items:center;margin-top:6px"><span style="font-size:13px;color:var(--text-secondary)">${E(s&&s.name)}</span><button data-add="${p.id}">أضف للسلة</button></div></div></div>`}
const delBtn=(k,id)=>S.del==k+id?`<button data-cd="${k}${id}" style="color:var(--text-danger);border-color:var(--border-danger)">تأكيد الحذف</button>`:`<button data-ask="${k}${id}">حذف</button>`;
function draw(){
 let h=topbar();if(window.FBERR)h+='<div class="card" style="color:var(--text-danger);direction:ltr;font-size:13px">'+E(window.FBERR)+'</div>';if(firebaseConfig.apiKey.startsWith('ضع'))h+='<div class="card" style="color:var(--text-danger)">لسه ما حطيتش إعدادات Firebase في أول ملف الموقع.</div>';
 if(S.v=='home'){const q=S.q.trim().toLowerCase();
  const fs=S.shops.filter(s=>(S.f=='all'||s.type==S.f)&&(!q||s.name.toLowerCase().includes(q)));
  const ps=q?S.prods.filter(p=>p.name.toLowerCase().includes(q)):[];
  h+=`<input id="q" ${B} placeholder="ابحث باسم المتجر أو المنتج" value="${E(S.q)}"><div style="display:flex;gap:6px;margin:6px 0">${[['all','الكل'],['rest','🍽️ مطاعم'],['market','🛒 ماركت']].map(x=>`<button data-f="${x[0]}" class="chip ${S.f==x[0]?'on':''}">${x[1]}</button>`).join('')}</div>`;
  if(ps.length)h+=`<p class="sec">منتجات</p>`+ps.map(pc).join('');
  h+=`<p class="sec">المتاجر</p>`+(fs.map(s=>`<div data-s="${s.id}" class="card shop"><div class="ic">${s.type=='rest'?'🍽️':'🛒'}</div><div style="flex:1"><b>${E(s.name)}</b><div><span class="tag">${T(s.type)}</span></div></div><span style="font-size:22px;color:var(--pr)">‹</span></div>`).join('')||`<p style="color:var(--text-secondary)">لا توجد متاجر بعد.</p>`)}
 else if(S.v=='shop'){const s=S.shops.find(x=>x.id==S.cur)||{};h+=`<button data-a="home">رجوع</button><h2>${E(s.name)}</h2><div style="font-size:13px;color:var(--text-secondary)">${T(s.type)}</div>`+(S.prods.filter(p=>p.sid==s.id).map(pc).join('')||'<p>لا توجد منتجات</p>')}
 else if(S.v=='cart'){h+=`<button data-a="home">رجوع</button><h2>السلة</h2>`;
  const g={};Object.keys(S.cart).forEach(i=>(g[S.cart[i].sid]=g[S.cart[i].sid]||[]).push(i));
  if(!Object.keys(g).length&&!S.done)h+='<p>السلة فاضية</p>';
  if(Object.keys(g).length)h+=`<div class="card"><p class="sec" style="margin-top:0">بيانات التوصيل</p><input id="cn" placeholder="الاسم" value="${E(S.cust.n)}"><input id="cp" placeholder="رقم التليفون" inputmode="tel" value="${E(S.cust.p)}"><input id="ca" placeholder="العنوان بالتفصيل" value="${E(S.cust.a)}"><p id="er" style="color:var(--text-danger);margin:4px 0 0"></p></div>`;
  
  Object.keys(g).forEach(sid=>{const s=S.shops.find(x=>x.id==sid)||{};const t=g[sid].reduce((a,i)=>a+S.cart[i].n*S.cart[i].price,0);
   h+=`<div class="card"><b>${E(s.name)}</b>${g[sid].map(i=>`<div style="display:flex;justify-content:space-between;align-items:center;margin:6px 0"><span>${E(S.cart[i].name)}</span><span><button data-m="${i}">-</button> ${S.cart[i].n} <button data-p="${i}">+</button></span></div>`).join('')}<div style="display:flex;justify-content:space-between;align-items:center"><b>الإجمالي ${t} ج</b><button data-o="${sid}">تأكيد الطلب ✅</button></div></div>`});
  if(S.done)h+=`<div style="background:var(--bg-success);border-radius:12px;padding:10px;margin:8px 0"><p style="margin:0 0 6px">الطلب جاهز. دوس على الزر وهيفتح واتساب والرسالة مكتوبة:</p><a class="wa" href="${S.done}" target="_blank">فتح واتساب وإرسال الطلب</a></div>`}
 else{h+=`<button data-a="home">رجوع</button><h2>الإدارة</h2>`;
  if(S.sub){const s=S.sub;h+=`<p class="sec">${E(s.name)} - إضافة منتج</p><input id="pn" ${B} placeholder="اسم المنتج"><input id="pp" ${B} placeholder="السعر" inputmode="decimal"><input id="ps" ${B} placeholder="المواصفات"><div style="display:flex;align-items:center;gap:10px;margin:6px 0">${IM(S.img,64)}<button type="button" data-a="pick" style="flex:1">${S.img?"تغيير الصورة":"اختيار صورة المنتج"}</button><input id="pi" type="file" accept="image/*" style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none"></div><button data-a="addP">إضافة المنتج</button><p id="er" style="color:var(--text-danger)"></p>`+S.prods.filter(p=>p.sid==s.id).map(p=>`<div class="card" style="display:flex;gap:10px;align-items:center">${IM(p.img,48)}<span style="flex:1">${E(p.name)} - ${E(p.price)} ج</span>${delBtn('p',p.id)}</div>`).join('')}
  else if(S.adm){h+=`<p class="sec">إضافة متجر جديد</p><input id="n" ${B} placeholder="اسم المطعم أو الماركت"><select id="t" ${B}><option value="rest">مطعم</option><option value="market">سوبر ماركت</option></select><input id="ph" ${B} placeholder="رقم الواتساب مثل 01012345678" inputmode="tel"><input id="u" ${B} placeholder="اسم مستخدم صاحب المتجر"><input id="pw" ${B} placeholder="كلمة سر صاحب المتجر"><button data-a="addS">إنشاء</button><p id="er" style="color:var(--text-danger)"></p><p class="sec">المتاجر (${S.shops.length})</p>`+(S.shops.map(s=>`<div class="card" style="display:flex;justify-content:space-between;align-items:center"><span>${E(s.name)}<br><small style="color:var(--text-secondary)">${T(s.type)} - ${E(s.phone)} - ${E(s.user)}</small></span>${delBtn('s',s.id)}</div>`).join('')||'<p style="color:var(--text-secondary)">لا توجد متاجر</p>')}
  else h+=`<p class="sec">تسجيل الدخول (أدمن أو صاحب متجر)</p><input id="lu" ${B} placeholder="الإيميل أو اسم المستخدم"><input id="lp" ${B} type="password" placeholder="كلمة السر"><button data-a="lg">دخول</button><p id="er" style="color:var(--text-danger)"></p>`}
 R.innerHTML=h;[['cn','n'],['cp','p'],['ca','a']].forEach(([i,k])=>{const e=document.getElementById(i);if(e)e.oninput=()=>{S.cust[k]=e.value}});
 const q=document.getElementById('q');if(q)q.oninput=()=>{S.q=q.value;const p=q.selectionStart;draw();const n=document.getElementById('q');n.focus();n.setSelectionRange(p,p)};
 const pi=document.getElementById('pi');if(pi)pi.onchange=()=>{const f=pi.files&&pi.files[0];if(!f)return;const fr=new FileReader();fr.onerror=()=>er('تعذر قراءة الصورة، جرّب صورة تانية');fr.onload=()=>{const im=new Image();im.onerror=()=>er('الملف ده مش صورة');im.onload=()=>{const k=Math.min(1,240/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);S.img=c.toDataURL('image/jpeg',.7);const k2={n:V('pn'),p:V('pp'),s:V('ps')};draw();document.getElementById('pn').value=k2.n;document.getElementById('pp').value=k2.p;document.getElementById('ps').value=k2.s};im.src=fr.result};fr.readAsDataURL(f)};
}
const V=id=>{const e=document.getElementById(id);return e?e.value.trim():''};
const er=m=>{const e=document.getElementById('er');if(e)e.textContent=m};
R.addEventListener('click',async e=>{const b=e.target.closest('button,[data-s]');if(!b)return;const d=b.dataset;
 if(d.s){S.cur=d.s;S.v='shop';return draw()}
 if(d.f){S.f=d.f;return draw()}
 if(d.add){const p=S.prods.find(x=>x.id==d.add);const c=S.cart[p.id];if(c)c.n++;else S.cart[p.id]={n:1,name:p.name,price:+p.price,sid:p.sid};return draw()}
 if(d.m){if(--S.cart[d.m].n<=0)delete S.cart[d.m];return draw()}
 if(d.p){S.cart[d.p].n++;return draw()}
 if(d.o){const s=S.shops.find(x=>x.id==d.o);const l=Object.keys(S.cart).filter(i=>S.cart[i].sid==d.o);const t=l.reduce((a,i)=>a+S.cart[i].n*S.cart[i].price,0);
  const c=S.cust,cn=c.n.trim(),cp=c.p.trim(),ca=c.a.trim();
  if(!cn||!ca||cp.replace(/\D/g,'').length<10)return er('اكتب الاسم ورقم تليفون صحيح والعنوان');
  const msg='طلب جديد من اطفيح مول\n\n'+l.map(i=>'- '+S.cart[i].name+' x '+S.cart[i].n).join('\n')+'\nالإجمالي: '+t+' جنيه\n\nبيانات العميل:\nالاسم: '+cn+'\nالتليفون: '+cp+'\nالعنوان: '+ca;
  let ph=String(s.phone).replace(/\D/g,'');if(ph[0]=='0')ph='20'+ph.slice(1);
  l.forEach(i=>delete S.cart[i]);S.done='https://wa.me/'+ph+'?text='+encodeURIComponent(msg);return draw()}
 if(d.ask){S.del=d.ask;return draw()}
 if(d.cd){const k=d.cd[0],id=d.cd.slice(1);S.del=null;
  try{if(k=='s'){const q=await db.collection('products').where('sid','==',id).get();const bt=db.batch();q.forEach(x=>bt.delete(x.ref));bt.delete(db.collection('shops').doc(id));await bt.commit()}else await db.collection('products').doc(id).delete()}catch(x){alert('تعذر الحذف: '+x.message)}
  return draw()}
 const a=d.a;S.del=null;
 if(a=='pick'){const i=document.getElementById('pi');if(i)i.click();return}
 if(a=='home'){S.v='home';S.done=null}else if(a=='cart'){S.v='cart'}else if(a=='adm'){S.v='adm'}
 else if(a=='logout'){await auth.signOut();S.img=null;S.v='home'}
 else if(a=='lg'){const u=V('lu'),pw=document.getElementById('lp').value;if(!u||!pw)return er('اكتب بيانات الدخول');
  const em=u.includes('@')?u:u.toLowerCase()+DOM;
  try{await auth.signInWithEmailAndPassword(em,pw)}catch(x){return er('بيانات الدخول غير صحيحة')}return}
 else if(a=='addS'){const n=V('n'),ph=V('ph'),u=V('u').toLowerCase(),pw=document.getElementById('pw').value;
  if(!n||!ph||!u||!pw)return er('املأ كل الخانات');
  if(!/^[a-z0-9._-]+$/.test(u))return er('اسم المستخدم بالإنجليزي وأرقام بس');
  if(pw.length<6)return er('كلمة السر 6 حروف أو أرقام على الأقل');
  try{const c=await sec.auth().createUserWithEmailAndPassword(u+DOM,pw);const uid=c.user.uid;await sec.auth().signOut();
   await db.collection('shops').doc(uid).set({name:n,type:V('t'),phone:ph,user:u})}
  catch(x){return er(x.code=='auth/email-already-in-use'?'اسم المستخدم ده مستخدم':'تعذر الإنشاء: '+x.message)}
  ['n','ph','u','pw'].forEach(i=>document.getElementById(i).value='')}
 else if(a=='addP'){if(!V('pn')||!V('pp'))return er('الاسم والسعر مطلوبين');if(!S.img)return er('اختار صورة للمنتج');
  try{await db.collection('products').add({sid:S.sub.id,name:V('pn'),price:V('pp'),specs:V('ps'),img:S.img})}catch(x){return er('تعذر الحفظ: '+x.message)}
  S.img=null}
 draw()});
function sync(){S.adm=!!(S.user&&S.user.email==ADMIN);S.sub=(S.user&&!S.adm)?(S.shops.find(x=>x.id==S.user.uid)||null):null;draw()}
draw();
try{
auth.onAuthStateChanged(u=>{S.user=u;sync()});
db.collection('shops').onSnapshot(q=>{S.shops=q.docs.map(d=>({id:d.id,...d.data()}));sync()},e=>{window.FBERR='shops: '+e.message;draw()});
db.collection('products').onSnapshot(q=>{S.prods=q.docs.map(d=>({id:d.id,...d.data()}));draw()},e=>{window.FBERR='products: '+e.message;draw()});
}catch(e){window.FBERR=window.FBERR||('Init: '+e.message);draw()}
draw();
</script></body></html>
